spring.application.name=loan

# database configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql= true

# Logging Configuration
logging.level.root=INFO
logging.level.com.enigmacamp.loan=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Spring Security Log Level
logging.level.org.springframework.security=DEBUG

# CORS Configuration
app.cors.allowed-origins=app.cors.allowed-origins=http://localhost:3000,https://tidings-flashy-cure.ngrok-free.dev

# Swagger/OpenAPI configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.csrf.enabled=false

# jsonplaceholder url
credit-scoring.base-url=https://leptosomic-unransomed-anisha.ngrok-free.dev

# jwt configuration
app.jwt-expiration-ms=${JWT_EXPIRATION}
app.jwt-secret=${JWT_SECRET}

# file configuration
# mengaktifkan fitur upload multipart/form-data request
spring.servlet.multipart.enabled=true
# batas maksimum ukuran file yang di upload
spring.servlet.multipart.max-file-size=5MB
# batas maksimum keseluruhan ukuran file yang di upload
spring.servlet.multipart.max-request-size=15MB

# directory cofiguration
app.upload.dir=./uploads